<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    .role-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 1.5px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 500;
      fill: #38bdf8;
    }
    .pill-bg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1;
      rx: 6px;
    }
  </style>

  <!-- Background Box -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="50" r="90" fill="#38bdf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="160" r="110" fill="#818cf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.15;0.08" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Header Content -->
  <g text-anchor="middle">
    <!-- Main Name -->
    <text x="450" y="85" class="name-title">Shreyansh</text>

    <!-- Subtitle -->
    <text x="450" y="125" class="role-subtitle">CLOUD &amp; DEVOPS ENGINEER</text>

    <!-- Feature Pills -->
    <!-- Pill 1: 43+ AWS Accounts -->
    <g transform="translate(145, 155)">
      <rect x="0" y="0" width="135" height="28" class="pill-bg" />
      <text x="67" y="18" text-anchor="middle" class="pill-text">☁️ 43+ AWS Accounts</text>
    </g>

    <!-- Pill 2: Kubernetes (EKS) -->
    <g transform="translate(295, 155)">
      <rect x="0" y="0" width="145" height="28" class="pill-bg" />
      <text x="72" y="18" text-anchor="middle" class="pill-text">☸️ Kubernetes &amp; EKS</text>
    </g>

    <!-- Pill 3: Terraform & GitOps -->
    <g transform="translate(455, 155)">
      <rect x="0" y="0" width="145" height="28" class="pill-bg" />
      <text x="72" y="18" text-anchor="middle" class="pill-text">⚙️ Terraform &amp; GitOps</text>
    </g>

    <!-- Pill 4: Zero-Downtime DR -->
    <g transform="translate(615, 155)">
      <rect x="0" y="0" width="140" height="28" class="pill-bg" />
      <text x="70" y="18" text-anchor="middle" class="pill-text">🛡️ Disaster Recovery</text>
    </g>
  </g>
</svg>
